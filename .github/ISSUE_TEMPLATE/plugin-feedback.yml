name: Mobile App Builder feedback
description: Report a missed outcome, confusing step, or useful improvement.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Share a short, redacted example. Do not include credentials, customer data, private source code, or full chat transcripts.
  - type: dropdown
    id: category
    attributes:
      label: What needs improvement?
      options:
        - Wrong workflow or recommendation
        - Repeated or unnecessary question
        - Lost or stale project context
        - Inaccurate research
        - Incomplete build or verification
        - Unclear report or presentation
        - Scheduled-run noise
        - Other
    validations:
      required: true
  - type: textarea
    id: intended-outcome
    attributes:
      label: What were you trying to achieve?
      placeholder: A short description of the user-visible result.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened, and what would have helped?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version or date, if known
