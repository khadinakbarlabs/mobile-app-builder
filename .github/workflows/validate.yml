name: Validate Anthropic edition
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/release.py
      - run: python tools/native_packages.py --output dist/native-ci
      - run: node tools/audit-public-package.mjs .
      - run: node tools/audit-public-package.mjs plugins/mobile-app-builder
      - run: node tools/audit-public-package.mjs dist/native-ci/codex/mobile-app-builder
      - run: node tools/audit-public-package.mjs dist/native-ci/cursor/mobile-app-builder
      - run: npx --yes @anthropic-ai/claude-code@2.1.287 plugin validate .claude-plugin/marketplace.json --strict
      - run: npx --yes @anthropic-ai/claude-code@2.1.287 plugin validate plugins/mobile-app-builder/.claude-plugin/plugin.json --strict
      - run: node tools/verify-host.mjs plugins/mobile-app-builder
